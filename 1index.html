<!DOCTYPE html>
<html>
<head>
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="1style.css">
</head>
<body>
  <div class="box">
    <h1>Student Task Manager</h1>

    <input id="task" placeholder="Enter your task">
    <button onclick="addTask()">Add Task</button>
    <button onclick="loadTasks()">Load Sample</button>

    <h3>My Tasks</h3>
    <ul id="list"></ul>
    <p id="count"></p>
    <h3>Sample Tasks</h3>
    <ul id="sample"></ul>
  </div>
  <script src="1script.js"></script>
</body>
</html>
